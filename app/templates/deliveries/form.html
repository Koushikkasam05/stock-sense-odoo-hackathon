{% extends "base.html" %}

{% block page_title %}New Outgoing Delivery Order{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card-theme p-4">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <h5 class="fw-bold mb-0">
                    <i class="bi bi-box-arrow-up-right text-primary me-2"></i>Create Delivery Order
                </h5>
                <a href="{{ url_for('deliveries.index') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>

            <form method="POST" action="{{ url_for('deliveries.create') }}">
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="customer_name" class="form-label">Customer / Recipient Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="customer_name" name="customer_name" required placeholder="e.g., Acme Distribution Ltd">
                    </div>

                    <div class="col-md-6">
                        <label for="source_location_id" class="form-label">Source Storage Location <span class="text-danger">*</span></label>
                        <select class="form-select" id="source_location_id" name="source_location_id" required>
                            {% for loc in locations %}
                            <option value="{{ loc.id }}">{{ loc.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="scheduled_date" class="form-label">Scheduled Dispatch Date</label>
                        <input type="date" class="form-control" id="scheduled_date" name="scheduled_date">
                    </div>

                    <div class="col-md-6">
                        <label for="notes" class="form-label">Sales Order / Dispatch Notes</label>
                        <input type="text" class="form-control" id="notes" name="notes" placeholder="e.g., SO-10492 / Express Courier">
                    </div>
                </div>

                <!-- Line Items Section -->
                <div class="border-top pt-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="fw-bold mb-0"><i class="bi bi-list-check text-primary me-2"></i>Products to Deliver</h6>
                        <button type="button" class="btn btn-sm btn-outline-primary" id="btn-add-line">
                            <i class="bi bi-plus-lg me-1"></i> Add Product Line
                        </button>
                    </div>

                    <div id="operation-lines-container">
                        <div class="row g-2 align-items-center mb-2 operation-line-row">
                            <div class="col-md-7">
                                <label class="form-label small d-md-none">Product</label>
                                <select name="product_id[]" class="form-select" required>
                                    <option value="">Select Product...</option>
                                    {% for p in products %}
                                    <option value="{{ p.id }}">{{ p.sku }} - {{ p.name }} (On Hand: {{ p.total_stock }} {{ p.uom }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small d-md-none">Quantity Demand</label>
                                <input type="number" step="any" min="0.01" name="demand[]" class="form-control" placeholder="Quantity" required>
                            </div>
                            <div class="col-md-1 text-end">
                                <button type="button" class="btn btn-outline-danger btn-remove-line" style="display: none;">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
                        <i class="bi bi-check-circle me-1"></i> Create Delivery Order
                    </button>
                    <a href="{{ url_for('deliveries.index') }}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
