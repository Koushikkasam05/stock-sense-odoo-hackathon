{% extends "base.html" %}

{% block page_title %}New Inventory Adjustment{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-theme p-4">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <h5 class="fw-bold mb-0">
                    <i class="bi bi-sliders text-info me-2"></i>Physical Inventory Count Audit
                </h5>
                <a href="{{ url_for('adjustments.index') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>

            <form method="POST" action="{{ url_for('adjustments.create') }}">
                <div class="row g-3">
                    <!-- Location Selector -->
                    <div class="col-md-6">
                        <label for="adj_location_id" class="form-label">Storage Location <span class="text-danger">*</span></label>
                        <select class="form-select" id="adj_location_id" name="location_id" required>
                            <option value="">Select Location...</option>
                            {% for loc in locations %}
                            <option value="{{ loc.id }}">{{ loc.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Product Selector -->
                    <div class="col-md-6">
                        <label for="adj_product_id" class="form-label">Product to Adjust <span class="text-danger">*</span></label>
                        <select class="form-select" id="adj_product_id" name="product_id" required>
                            <option value="">Select Product...</option>
                            {% for p in products %}
                            <option value="{{ p.id }}">{{ p.sku }} - {{ p.name }} ({{ p.uom }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- System Qty vs Physical Counted Qty -->
                    <div class="col-md-4">
                        <label for="adj_system_qty" class="form-label">Current System Quantity</label>
                        <input type="text" class="form-control bg-light fw-bold" id="adj_system_qty" value="0.0" readonly>
                        <div class="form-text">Fetched automatically from ledger/quants.</div>
                    </div>

                    <div class="col-md-4">
                        <label for="adj_counted_qty" class="form-label">Physical Counted Quantity <span class="text-danger">*</span></label>
                        <input type="number" step="any" min="0" class="form-control fw-bold fs-5 text-primary" id="adj_counted_qty" name="counted_quantity" required placeholder="0.0">
                        <div class="form-text">Actual count observed on floor.</div>
                    </div>

                    <div class="col-md-4 d-flex flex-column justify-content-center">
                        <label class="form-label mb-1">Calculated Variance</label>
                        <div>
                            <span id="adj_difference_display" class="badge bg-secondary fs-5 py-2 px-3">0</span>
                        </div>
                    </div>

                    <!-- Reason -->
                    <div class="col-12">
                        <label for="reason" class="form-label">Reason for Variance / Audit Notes</label>
                        <input type="text" class="form-control" id="reason" name="reason" placeholder="e.g., Annual physical stock audit, damaged goods write-off, count correction">
                    </div>

                    <div class="col-12 mt-4 pt-3 border-top">
                        <button type="submit" class="btn btn-info text-dark px-4 py-2 fw-semibold">
                            <i class="bi bi-check2-all me-1"></i> Apply Stock Adjustment
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
