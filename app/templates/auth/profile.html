{% extends "base.html" %}

{% block page_title %}User Account & Profile Settings{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-theme p-4">
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 54px; height: 54px; font-size: 1.25rem; font-weight: 700;">
                    {{ current_user.full_name[:2].upper() }}
                </div>
                <div>
                    <h5 class="fw-bold mb-0">{{ current_user.full_name }}</h5>
                    <div class="text-muted small">{{ current_user.email }} &bull; <span class="badge bg-secondary">{{ current_user.role_display }}</span></div>
                </div>
            </div>

            <form method="POST" action="{{ url_for('auth.profile') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control bg-light" id="username" value="{{ current_user.username }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control bg-light" id="email" value="{{ current_user.email }}" readonly>
                    </div>

                    <div class="col-12">
                        <label for="full_name" class="form-label">Full Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="full_name" name="full_name" value="{{ current_user.full_name }}" required>
                    </div>

                    <div class="col-12 mt-4 pt-3 border-top">
                        <h6 class="fw-bold text-secondary mb-3"><i class="bi bi-shield-lock text-primary me-2"></i>Change Account Password (Optional)</h6>
                    </div>

                    <div class="col-12">
                        <label for="current_password" class="form-label">Current Password</label>
                        <input type="password" class="form-control" id="current_password" name="current_password" placeholder="Required only if changing password">
                    </div>

                    <div class="col-md-6">
                        <label for="new_password" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" minlength="6" placeholder="••••••••">
                    </div>

                    <div class="col-md-6">
                        <label for="confirm_password" class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" placeholder="••••••••">
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
                            <i class="bi bi-save me-1"></i> Save Profile Changes
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
