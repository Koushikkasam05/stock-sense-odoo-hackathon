{% extends "base.html" %}

{% block page_title %}Unauthorized (401){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-info mb-3">401</div>
    <h3 class="fw-bold mb-2">Authentication Required</h3>
    <p class="text-muted mb-4">You must be logged in with a valid session to access this resource.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary px-4 py-2">
        <i class="bi bi-box-arrow-in-right me-1"></i> Proceed to Login
    </a>
</div>
{% endblock %}
