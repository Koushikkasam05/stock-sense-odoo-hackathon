{% extends "base.html" %}

{% block page_title %}Bad Request (400){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-warning mb-3">400</div>

    <p class="text-muted mb-4">The server could not understand the request due to invalid syntax or parameters.</p>

        <i class="bi bi-house me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
